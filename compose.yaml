name: pi-stick
services:
  pi-stick:
    container_name: pi-stick
    image: homelab/pi-stick:current
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    volumes:
      - ./state/sessions:/sessions
    mem_limit: 2g
    pids_limit: 128
