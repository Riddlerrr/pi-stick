name: Linux binary release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run check && npm test
      - name: Test npm tarball
        if: matrix.arch == 'x64'
        run: |
          npm run pack:npm
          npm install --prefix "$RUNNER_TEMP/npm" --offline ./dist/pi-stick-*.tgz
          PI_STICK_TEST_BINARY="$RUNNER_TEMP/npm/node_modules/pi-stick/pistick.js" npm test
      - run: npm run build:binary
      - name: Test extracted binary
        run: |
          tar -xzf dist/pi-stick-linux-${{ matrix.arch }}.tar.gz -C "$RUNNER_TEMP"
          PI_STICK_TEST_BINARY="$RUNNER_TEMP/pi-stick/pistick" npm test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish Linux archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --verify-tag --notes-from-tag
